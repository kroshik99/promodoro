<svg viewBox="0 0 600 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A leafy potted plant beside a notebook and pen">
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#fbf6ec" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#fbf6ec" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="potGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c98a5e" />
      <stop offset="100%" stop-color="#a86540" />
    </linearGradient>

    <linearGradient id="potRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba274" />
      <stop offset="100%" stop-color="#c98a5e" />
    </linearGradient>

    <radialGradient id="soilGrad" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#5b4636" />
      <stop offset="100%" stop-color="#3c2e23" />
    </radialGradient>

    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" />
    </filter>

    <path id="leaf" d="M0,0 C-34,-22 -46,-72 -19,-121 C-9,-140 0,-152 0,-152 C0,-152 9,-140 19,-121 C46,-72 34,-22 0,0 Z" fill="currentColor" />
  </defs>

  <rect width="600" height="460" fill="url(#glow)" />

  <ellipse cx="300" cy="432" rx="105" ry="16" fill="#33261c" opacity="0.18" filter="url(#softBlur)" />

  <g transform="translate(300,344)">
    <use href="#leaf" transform="rotate(-52) scale(0.82)" style="color:#5c6e4c" opacity="0.85" />
    <use href="#leaf" transform="rotate(52) scale(0.8)" style="color:#5c6e4c" opacity="0.85" />
    <use href="#leaf" transform="rotate(-30) scale(1.05)" style="color:#71835c" />
    <use href="#leaf" transform="rotate(30) scale(1.0)" style="color:#657a52" />
    <use href="#leaf" transform="rotate(-9) scale(1.18)" style="color:#7d9166" />
    <use href="#leaf" transform="rotate(12) scale(1.12)" style="color:#4f5f42" />

    <line x1="0" y1="0" x2="-6" y2="-112" stroke="#3c4a32" stroke-width="1.5" opacity="0.35" transform="rotate(-9) scale(1.18)" />
    <line x1="0" y1="0" x2="6" y2="-112" stroke="#2e3b26" stroke-width="1.5" opacity="0.35" transform="rotate(12) scale(1.12)" />
  </g>

  <path d="M228,338 L372,338 L356,436 Q300,448 244,436 Z" fill="url(#potGrad)" />
  <path d="M226,338 L374,338 L370,352 L230,352 Z" fill="url(#potRim)" />
  <ellipse cx="300" cy="338" rx="72" ry="12" fill="url(#soilGrad)" />

  <g transform="translate(392,372) rotate(-6)">
    <rect x="0" y="0" width="130" height="86" rx="6" fill="#efe8db" stroke="#d9cfba" stroke-width="1.5" />
    <line x1="0" y1="16" x2="0" y2="70" stroke="#c7bba3" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 7" />
    <line x1="18" y1="26" x2="104" y2="26" stroke="#c9bfa9" stroke-width="3" stroke-linecap="round" />
    <line x1="18" y1="42" x2="94" y2="42" stroke="#c9bfa9" stroke-width="3" stroke-linecap="round" />
    <line x1="18" y1="58" x2="100" y2="58" stroke="#c9bfa9" stroke-width="3" stroke-linecap="round" />
  </g>

  <g transform="translate(452,362) rotate(38)">
    <rect x="0" y="0" width="8" height="92" rx="4" fill="#4a453d" />
    <path d="M0,90 L8,90 L4,102 Z" fill="#8a8578" />
  </g>
</svg>
